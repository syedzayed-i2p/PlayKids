      (function () {
        try {
          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function (obj, prop, descriptor) {
            if (
              (obj === window || obj === globalThis) &&
              prop === 'fetch' &&
              descriptor &&
              typeof descriptor.get === 'function' &&
              typeof descriptor.set !== 'function'
            ) {
              var origGet = descriptor.get;
              var customFetch = null;
              return origDefineProperty.call(this, obj, prop, {
                configurable: true,
                enumerable: descriptor.enumerable !== false,
                get: function () {
                  return customFetch || origGet.call(this);
                },
                set: function (val) {
                  if (typeof val === 'function') {
                    customFetch = val;
                  }
                },
              });
            }
            return origDefineProperty.call(this, obj, prop, descriptor);
          };

          var existingDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (existingDesc && typeof existingDesc.get === 'function' && typeof existingDesc.set !== 'function') {

                }
              },

            'error',

              var file = (e && e.filename) || '';
              if (
                msg.indexOf('Cannot set property fetch') !== -1 ||
                file.indexOf('chrome-extension://') === 0
              ) {
                e.stopImmediatePropagation();
                e.preventDefault();
                return false;
              }
            },
            true
